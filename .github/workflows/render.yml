#!/usr/bin/env python3
"""
RCW Cloud Video Renderer — runs in GitHub Actions (free cloud minutes).
Input : video_script.json (slides + narration text per slide)
Output: rendered MP4 (1280x720, slides + AI voiceover), unlimited length.
"""
import json, os, subprocess, sys, tempfile

def log(m): print(f"[renderer] {m}", flush=True)

def main():
    script_path = "video_script.json"
    if not os.path.exists(script_path):
        sys.exit("video_script.json not found")
    script = json.load(open(script_path, encoding="utf-8"))

    title = script.get("title", "RCW IT Training Lab")
    slides = script.get("slides", [])
    if not slides:
        sys.exit("no slides in script")

    log(f"Rendering '{title}' with {len(slides)} slides")

    # ---- 1) Build one slide image per slide (1280x720) with PIL ----
    try:
        from PIL import Image, ImageDraw, ImageFont
    except ImportError:
        subprocess.run([sys.executable, "-m", "pip", "install", "-q", "pillow"], check=True)
        from PIL import Image, ImageDraw, ImageFont

    os.makedirs("slides", exist_ok=True)
    fonts = []
    for cand in ["/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf",
                 "/usr/share/fonts/truetype/liberation/LiberationSans-Bold.ttf"]:
        if os.path.exists(cand):
            fonts.append(cand)
    def font(sz, bold=True):
        if fonts and bold:
            try: return ImageFont.truetype(fonts[0], sz)
            except Exception: pass
        return ImageFont.load_default()

    W, H = 1280, 720
    for i, s in enumerate(slides):
        img = Image.new("RGB", (W, H), "#061633")
        d = ImageDraw.Draw(img)
        # top gold bar
        d.rectangle([0, 0, W, 12], fill="#ffd51d")
        # heading
        d.text((60, 70), s.get("heading", "Slide"), font=font(54), fill="#ffffff")
        # body lines (wrap)
        y = 170
        body = s.get("body", "")
        for line in body.split("\n"):
            line = line.strip()
            if not line: y += 30; continue
            # crude wrap at ~62 chars
            while len(line) > 62:
                d.text((60, y), line[:62], font=font(28), fill="#dbe7ff")
                line = line[62:]; y += 40
            d.text((60, y), line, font=font(28), fill="#dbe7ff")
            y += 40
        # footer
        d.text((60, H - 55), "RCW IT Training — www.rcwittraining.in", font=font(24), fill="#4bd7ff")
        img.save(f"slides/slide_{i:03d}.png")
    log("slides rendered")

    # ---- 2) Generate narration audio per slide (macOS `say` if available, else espeak-ng) ----
    os.makedirs("audio", exist_ok=True)
    for i, s in enumerate(slides):
        text = s.get("narration") or s.get("body") or s.get("heading") or ""
        text = text.strip()
        if not text: continue
        txt_path = f"audio/slide_{i:03d}.txt"
        with open(txt_path, "w", encoding="utf-8") as f:
            f.write(text)
        wav = f"audio/slide_{i:03d}.wav"
        # Try espeak-ng (available on ubuntu runners)
        subprocess.run(["espeak-ng", "-v", "en-us", "-s", "150", "-w", wav, "-f", txt_path], check=False)
        if not os.path.exists(wav) or os.path.getsize(wav) < 100:
            log(f"  espeak failed for slide {i}, using silent gap")
            # create silent wav via ffmpeg
            subprocess.run(["ffmpeg", "-y", "-f", "lavfi", "-i", "anullsrc=r=22050:cl=mono",
                            "-t", "6", wav], check=False)
    log("narration audio generated")

    # ---- 3) Stitch with ffmpeg: each slide shown for its narration duration + 0.8s ----
    segs = []
    for i, s in enumerate(slides):
        img = f"slides/slide_{i:03d}.png"
        wav = f"audio/slide_{i:03d}.wav"
        if os.path.exists(wav):
            dur = subprocess.run(["ffprobe", "-v", "error", "-show_entries", "format=duration",
                                  "-of", "default=noprint_wrappers=1:nokey=1", wav],
                                 capture_output=True, text=True).stdout.strip()
            try: dur = float(dur) + 0.8
            except Exception: dur = 7.0
        else:
            dur = 7.0
        segs.append({"img": img, "wav": wav, "dur": dur})

    with open("concat.txt", "w") as f:
        for seg in segs:
            f.write(f"file '{os.path.abspath(seg['img'])}'\n")
            f.write(f"duration {seg['dur']:.3f}\n")

    # Build filter: each image -> looped video, audio appended
    inputs = []
    for seg in segs:
        inputs += ["-loop", "1", "-i", seg["img"]]
        if os.path.exists(seg["wav"]):
            inputs += ["-i", seg["wav"]]
    # We'll do it in two steps: video part + audio concat
    vf = []
    idx = 0
    for i, seg in enumerate(segs):
        vf.append(f"[{i}:v]scale=1280:720,setsar=1,trim=duration={seg['dur']:.3f},setpts=PTS-STARTPTS[v{i}]")
    vf.append("".join(f"[v{i}]" for i in range(len(segs))) + f"concat=n={len(segs)}:v=1:a=0[vout]")

    # audio: concat all wavs
    af = []
    a_idx = 0
    for i, seg in enumerate(segs):
        if os.path.exists(seg["wav"]):
            af.append(f"[{i*2+1}:a]atrim=0:{seg['dur']:.3f},asetpts=PTS-STARTPTS[a{i}]")
            a_idx = i
    # simpler: build audio concat filter list
    audio_inputs = [i for i, seg in enumerate(segs) if os.path.exists(seg["wav"])]
    afilt = "".join(f"[{i*2+1}:a]aresample=22050,atrim=0:{segs[i]['dur']:.3f},asetpts=PTS-STARTPTS[a{i}]" for i in audio_inputs)
    if audio_inputs:
        afilt += "".join(f"[a{i}]" for i in audio_inputs) + f"concat=n={len(audio_inputs)}:v=0:a=1[aout]"

    cmd = ["ffmpeg", "-y"]
    for seg in segs:
        cmd += ["-loop", "1", "-i", seg["img"]]
    for seg in segs:
        if os.path.exists(seg["wav"]):
            cmd += ["-i", seg["wav"]]
    cmd += ["-filter_complex", ";".join(vf + ([afilt] if audio_inputs else [])),
            "-map", "[vout]"]
    if audio_inputs:
        cmd += ["-map", "[aout]"]
    cmd += ["-c:v", "libx264", "-preset", "veryfast", "-crf", "23", "-pix_fmt", "yuv420p",
            "-c:a", "aac", "-b:a", "128k", "-shortest", "output.mp4"]
    log("running ffmpeg: " + " ".join(cmd)[:400])
    r = subprocess.run(cmd, capture_output=True, text=True)
    if r.returncode != 0:
        log("ffmpeg error: " + r.stderr[-1500:])
        sys.exit("ffmpeg failed")
    log("DONE — output.mp4")

if __name__ == "__main__":
    main()
