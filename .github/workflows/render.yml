name: Render Lab Video

on:
  workflow_dispatch:
    inputs:
      script:
        description: 'Base64-encoded video_script.json (title, description, tags, slides with narration)'
        required: true
      privacy:
        description: 'privacyStatus (private | unlisted | public)'
        required: false
        default: 'unlisted'
      playlist:
        description: 'Optional YouTube playlist ID (PL...) to add the video to'
        required: false
        default: ''
      yt_client_id:
        description: 'YouTube OAuth client ID'
        required: false
        default: ''
      yt_client_secret:
        description: 'YouTube OAuth client secret'
        required: false
        default: ''
      yt_refresh_token:
        description: 'YouTube OAuth refresh token'
        required: false
        default: ''

jobs:
  render-and-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install pillow google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2 edge-tts

      - name: Decode script
        run: |
          echo "${{ github.event.inputs.script }}" | base64 -d > video_script.json
          echo "Script received:" && python3 -c "import json;d=json.load(open('video_script.json'));print(' title:',d.get('title'));print(' slides:',len(d.get('slides',[])))"

      - name: Render video (slides + AI voiceover)
        run: python renderer_lib.py

      - name: Upload to YouTube
        env:
          YT_CLIENT_ID: ${{ github.event.inputs.yt_client_id }}
          YT_CLIENT_SECRET: ${{ github.event.inputs.yt_client_secret }}
          YT_REFRESH_TOKEN: ${{ github.event.inputs.yt_refresh_token }}
          YT_PRIVACY: ${{ github.event.inputs.privacy }}
          YT_PLAYLIST: ${{ github.event.inputs.playlist }}
        run: python upload_youtube.py

      - name: Write summary
        run: |
          {
            echo "## Render + Upload result"
            echo ""
            echo "Video file: \`$(ls -lh output.mp4 | awk '{print $5}')\`"
            echo "Video URL: $(grep -o 'https://youtu.be/[A-Za-z0-9_-]*' upload.log 2>/dev/null || echo 'see step log')"
            echo "Privacy: ${{ github.event.inputs.privacy }}"
          } >> "$GITHUB_STEP_SUMMARY"

      # CLEANUP: runners are ephemeral (files die with the VM) + delete any old artifacts
      - name: Cleanup artifacts (keep repo tidy)
        if: always()
        run: |
          echo "Runner files are ephemeral — no persistent storage used."
          echo "Artifacts:"
          curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts?per_page=100" | grep -o '"name": *"[^"]*"' || echo "none"

      # Upload artifact ONLY if the YouTube upload didn't happen (so nothing is kept after success)
      - name: Upload video artifact (fallback only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-video-fallback
          path: output.mp4
          retention-days: 7
