name: Render Lab Video

on:
  workflow_dispatch:
    inputs:
      script:
        description: 'Base64-encoded video_script.json (title + slides with narration)'
        required: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng
          pip install pillow

      - name: Decode script
        run: |
          echo "${{ github.event.inputs.script }}" | base64 -d > video_script.json
          cat video_script.json | head -c 300

      - name: Render video
        run: python render_video.py

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: rendered-video
          path: output.mp4
          retention-days: 7

      - name: Show size
        run: ls -lh output.mp4
